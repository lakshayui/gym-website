<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="form.css">
</head>
<body>
    <form action="">
        <label for="name">Full Name:</label>
        <input type="text" id="name" name="user_name"><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="user_email"><br>
        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" name="user_mobile"><br>
        <p>Fitness Goal:</p>
        <label for="loss">Weight Loss</label>
        <input type="checkbox" id="loss" name="user_goal" value="Weight Loss"><br>
        <label for="gain">Muscle Gain</label>
        <input type="checkbox" id="gain" name="user_goal" value="Muscle Gain"><br>
        <label for="strength">Strength</label>
        <input type="checkbox" id="strength" name="user_goal" value="strength"><br>
        <button id="join" type="submit">JOIN</button>
    </form>
</body>
</html>
